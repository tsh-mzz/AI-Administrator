[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeploy = "python manage.py migrate --noinput && python manage.py shell < scripts/ensure_superuser.py"
startCommand = "sh -c \"gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120\""
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
