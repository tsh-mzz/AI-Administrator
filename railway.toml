[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# preDeploy runs migrations before the new container takes traffic.
# startCommand and healthcheckPath are intentionally NOT set here so each
# service (web, celery-worker, celery-beat) can override them in the UI
# without being clobbered on every redeploy.
preDeploy = "python manage.py migrate --noinput && python manage.py shell < scripts/ensure_superuser.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
