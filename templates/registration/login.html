<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход — Sm0rchki</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-xl shadow p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Sm0rchki</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <p class="text-red-500 text-sm mb-4">Неверный логин или пароль.</p>
      {% endif %}
      <div class="mb-4">
        <label class="block text-sm text-gray-600 mb-1">Логин</label>
        <input name="username" type="text" autofocus
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div class="mb-6">
        <label class="block text-sm text-gray-600 mb-1">Пароль</label>
        <input name="password" type="password"
          class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-medium">
        Войти
      </button>
    </form>
  </div>
</body>
</html>
